name: Signal K end-to-end
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
permissions:
  contents: read
jobs:
  signalk-e2e:
    # Matches the repository-pinned Signal K ARM64 image.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:signalk:e2e
