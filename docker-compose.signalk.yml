services:
  signalk:
    # Official arm64 build digest for sha-3e12725-24.x, verified from Docker Hub.
    image: signalk/signalk-server@sha256:92c558f9dc721ef6ab87c452c93e623a6580f0cfe21aababfbec363a3a04ef8b
    ports: ['127.0.0.1:${SIGNALK_PORT:-3000}:3000']
    volumes:
      - signalk-data:/home/node/.signalk
      # Signal K scans its app and config node_modules only during startup.
      # Keeping this development plugin at a scanned app path avoids a stale
      # persistent-volume install or exited init container being mistaken for
      # a running-server plugin registration.
      - ./signalk-plugin-telltales:/home/node/signalk/node_modules/signalk-telltales-observations:ro
volumes:
  signalk-data:
